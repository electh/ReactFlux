name: "translator"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  translate:
    if: >-
      github.repository == 'electh/ReactFlux' &&
      github.actor != 'dependabot[bot]'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: tisfeng/issues-translate-action@71e9aa61b05d65b9d82faedbe926b5985255f48b # v2.9.1
        continue-on-error: true
        with:
          BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_LOGIN_NAME: github-actions[bot]
          IS_MODIFY_TITLE: true
          PRIMARY_LANGUAGE: en
          SECONDARY_LANGUAGE: ""
          CUSTOM_BOT_NOTE: Bot automatically translated this content.

name: Push Docker image to Docker Hub

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build for an authorized post-merge deployment
        required: false
        type: string
        default: ""
      release_tag:
        description: Date-based image tag supplied by the scheduled tag workflow
        required: false
        type: string
        default: ""
      source_sha:
        description: Full commit SHA used as an image tag after an authorized merge
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: docker-publish-${{ inputs.release_tag != '' && format('v{0}', inputs.release_tag) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.repository == 'electh/ReactFlux' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
        ((inputs.release_tag != '' && inputs.checkout_ref == '' && inputs.source_sha == '') ||
         (inputs.release_tag == '' && inputs.checkout_ref == inputs.source_sha &&
          inputs.source_sha != ''))) ||
       (github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' &&
        inputs.release_tag == '' && inputs.checkout_ref == inputs.source_sha &&
        inputs.source_sha != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Authorize publish context
        id: authorize
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"

          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid scheduled image tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ -z "$SOURCE_SHA" ]]; then
            exit 0
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$CHECKOUT_REF" != "$SOURCE_SHA" ]]; then
            echo "The authorized source SHA and checkout ref must be the same full commit SHA" >&2
            exit 1
          fi

          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" --jq .status)"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "Authorized source $SOURCE_SHA is not on main; comparison status is $comparison"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          already_deployed="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" \
              --jq '[.statuses[] | select(.context == "reactflux/docker" and .state == "success")] | length > 0'
          )"
          if [[ "$already_deployed" == "true" ]]; then
            echo "Docker image for $SOURCE_SHA is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.authorize.outputs.publish == 'true'
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Docker Buildx
        if: steps.authorize.outputs.publish == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: steps.authorize.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.authorize.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: electh/reactflux
          tags: |
            type=raw,value=latest,enable=${{ inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=,enable=${{ inputs.release_tag == '' && inputs.source_sha == '' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.source_sha || 'unused' }},enable=${{ inputs.source_sha != '' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.release_tag || 'unused' }},enable=${{ inputs.release_tag != '' }}

      - name: Build and push Docker image
        if: steps.authorize.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release

      - name: Mark Docker deployment
        if: steps.authorize.outputs.publish == 'true' && inputs.release_tag == '' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SHA: ${{ inputs.source_sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -f state=success \
            -f context=reactflux/docker \
            -f description="Docker image published"

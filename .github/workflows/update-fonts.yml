name: Update Fonts

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: font-update-pipeline
  cancel-in-progress: false

jobs:
  update-fonts:
    if: >-
      github.repository == 'electh/ReactFlux' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run transactional font update
        id: update
        run: pnpm update-fonts

      - name: Validate generated assets and paths
        id: validate
        if: steps.update.outputs.changes == 'true'
        run: pnpm validate:fonts --working-tree --allow-structural-change

      - name: Create or update pull request
        id: create-pull-request
        if: steps.update.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(fonts): update fonts to latest versions"
          commit-message: |
            chore(fonts): update fonts to latest versions

            Font-Update-Run: ${{ github.run_id }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          body: |
            Automated update of the locally hosted Google Fonts.

            - Font families: ${{ steps.update.outputs.font_count }}
            - WOFF2 files: ${{ steps.update.outputs.file_count }}
            - Structural change: ${{ steps.validate.outputs.structural_change }}

            The follow-up workflow validates the exact PR head. Structural changes are never auto-merged.
          branch: bot/update-fonts
          base: main
          delete-branch: true
          add-paths: |
            public/fonts/**/*.woff2
            public/fonts/version.json
            public/styles/fonts.css
          labels: |
            dependencies
            automated

      - name: Verify pull request handoff
        if: steps.update.outputs.changes == 'true'
        env:
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: |
          if [[ -z "$PR_NUMBER" || -z "$PR_URL" ]]; then
            echo "Font assets changed, but the pull request action returned no open PR" >&2
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          CHANGES: ${{ steps.update.outputs.changes }}
          PR_OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
          PR_OUTCOME: ${{ steps.create-pull-request.outcome }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          {
            echo "### Font Update Summary"
            echo
            if [[ "$UPDATE_OUTCOME" != "success" ]]; then
              echo "❌ Font update failed"
            elif [[ "$CHANGES" != "true" ]]; then
              echo "ℹ️ Fonts are already up to date"
            elif [[ "$VALIDATION_OUTCOME" != "success" ]]; then
              echo "❌ Generated assets failed validation"
            elif [[ "$PR_OUTCOME" != "success" || -z "$PR_URL" ]]; then
              echo "❌ Pull request creation failed"
            else
              echo "✅ Pull request processed ($PR_OPERATION)"
              echo
              echo "- $PR_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

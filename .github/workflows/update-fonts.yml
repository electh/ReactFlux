name: Update Fonts

on:
  schedule:
    - cron: "0 0 * * 6"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-fonts:
    if: >-
      github.repository == 'electh/ReactFlux' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run font update script
        run: node scripts/update-fonts.js

      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Get update info
        if: steps.check-changes.outputs.changes == 'true'
        id: update-info
        run: |
          if [[ -f public/fonts/version.json ]]; then
            FONT_COUNT=$(jq -r '.fonts | length' public/fonts/version.json)
            FILE_COUNT=$(jq -r '[.fonts[].files] | add' public/fonts/version.json)
            echo "font_count=$FONT_COUNT" >> $GITHUB_OUTPUT
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/fonts public/styles/fonts.css
          git commit -m "chore(fonts): update fonts to latest versions"

      - name: Create Pull Request
        id: create-pull-request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(fonts): update fonts to latest versions"
          body: |
            This PR was automatically created by GitHub Actions to update the locally hosted Google Fonts.

            ### Changes
            - **Font families updated**: ${{steps.update-info.outputs.font_count}}
            - **Total font files**: ${{steps.update-info.outputs.file_count}}

            ### Files Changed
            - `public/fonts/*/` - Updated font files (woff2)
            - `public/styles/fonts.css` - Updated CSS
            - `public/fonts/version.json` - Version tracking

            ---
            🤖 Auto-generated by [Update Fonts workflow](${{ github.server_url}}/${{github.repository}}/actions/workflows/update-fonts.yml)
          branch: bot/update-fonts
          base: main
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Summary
        if: always()
        env:
          CHANGES_DETECTED: ${{ steps.check-changes.outputs.changes }}
          PR_OUTCOME: ${{ steps.create-pull-request.outcome }}
          PR_OPERATION: ${{ steps.create-pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          FONT_COUNT: ${{ steps.update-info.outputs.font_count }}
          FILE_COUNT: ${{ steps.update-info.outputs.file_count }}
        run: |
          {
            echo "### Font Update Summary"
            echo

            if [[ "$CHANGES_DETECTED" != "true" ]]; then
              echo "ℹ️ No changes detected - fonts are up to date"
            elif [[ "$PR_OUTCOME" != "success" ]]; then
              echo "❌ Changes detected, but pull request creation failed"
              echo
              echo "Review the \`Create Pull Request\` step for details."
            elif [[ -n "$PR_URL" ]]; then
              case "$PR_OPERATION" in
                created | updated)
                  echo "✅ Changes detected and pull request $PR_OPERATION"
                  ;;
                *)
                  echo "ℹ️ Changes detected and pull request processed ($PR_OPERATION)"
                  ;;
              esac
              echo
              echo "- Pull request: $PR_URL"
              echo "- Font families: $FONT_COUNT"
              echo "- Total files: $FILE_COUNT"
            else
              echo "⚠️ Changes detected, but no pull request was created or updated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Dependabot release-age retry

on:
  schedule:
    - cron: "37 */6 * * *"

  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-release-age-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Retry release-age failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPENDABOT_WORKFLOW_FILE: dependabot-auto-merge.yml
          MAX_RUN_ATTEMPTS: "6"
        run: bash .github/scripts/retry-dependabot-release-age.sh

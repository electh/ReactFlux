name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate pnpm-lock.yaml
        id: validate_lock
        run: |
          echo "Validating pnpm-lock.yaml file..."
          pnpm install --frozen-lockfile --ignore-scripts
          echo "✅ pnpm-lock.yaml validation passed"

      - name: Comment on invalid lock file
        if: failure() && steps.validate_lock.outcome == 'failure'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ **Automatic merge failed**

          Validation of pnpm-lock.yaml failed. Possible reasons:
          - pnpm supply-chain policy blocked a package that is too new (for example, \`ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION\`)
          - Dependency conflicts with other PRs
          - Corrupted or inconsistent lock file

          If this is a minimum release age failure, keep this PR unchanged and rerun the workflow after the policy window expires. Recreating the PR may select newer transitive dependencies and restart the waiting period.

          Otherwise, manually inspect and repair the lock file."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ESLint check
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

      - name: Merge eligible Dependabot PR
        if: |
          success() &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

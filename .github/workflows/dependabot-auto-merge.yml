name: Dependabot auto-merge
on: pull_request

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependency-type: ${{ steps.metadata.outputs.dependency-type }}
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate pnpm-lock.yaml
        run: |
          echo "Validating pnpm-lock.yaml file..."
          pnpm install --frozen-lockfile --ignore-scripts
          echo "✅ pnpm-lock.yaml validation passed"

      - name: Run ESLint check
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

  comment:
    needs: validate
    if: always() && needs.validate.result == 'failure' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on failed validation
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ **Automatic merge failed**

          Validation of this dependency update failed. Possible reasons include:
          - pnpm's minimum release age policy blocked a newly published package
          - Dependency conflicts with other PRs
          - A lint or formatting error
          - A corrupted or inconsistent lock file

          Runs blocked by the minimum release age policy are retried automatically every six hours, up to five times. Keep this PR unchanged while it waits; recreating it may select newer transitive dependencies and restart the waiting period.

          Other validation failures require manual inspection and repair."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge:
    needs: validate
    if: |
      needs.validate.result == 'success' &&
      (needs.validate.outputs.update-type == 'version-update:semver-patch' ||
       needs.validate.outputs.dependency-type == 'direct:development')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge eligible Dependabot PR
        run: gh pr merge --auto --squash --match-head-commit "$EXPECTED_HEAD" "$PR_URL"
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
